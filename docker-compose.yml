services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: slide-rag-qdrant
    user: "1000:1000"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
      - ./data/qdrant_snapshots:/qdrant/snapshots
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    restart: unless-stopped